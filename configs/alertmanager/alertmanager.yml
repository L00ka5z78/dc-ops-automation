# /etc/alertmanager/alertmanager.yml
# Wersja docelowa dla fazy automatyzacji (dzień 6).
#
# Zmiany względem projektu bazowego (dc-operations-lab):
#   1. URL webhooka Slacka trafia do pliku (slack_api_url_file) — w configu nie ma
#      ani sekretu, ani placeholdera (patrz INC-014 w repo bazowym).
#   2. Alerty dostają DWA kanały: Slack (podstawowy) i webhook do n8n (dodatkowy).
#      Awaria jednego nie blokuje drugiego — do potwierdzenia w teście AUT-001.
#   3. Alerty komponentu "automation" (np. n8nDown) omijają n8n i idą tylko na Slacka.
#
# Pliki sekretów na hoście (nie w repo):
#   /etc/alertmanager/slack_webhook_url    # pełny URL webhooka Slacka, jedna linia
#   /etc/alertmanager/n8n_webhook_token    # sam token, jedna linia (bez słowa "Bearer")
#   chown root:alertmanager ... ; chmod 0640 ...

global:
  resolve_timeout: 5m
  slack_api_url_file: /etc/alertmanager/slack_webhook_url

route:
  group_by: ["alertname", "instance"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: "slack-and-n8n"
  routes:
    # Awarie samej automatyzacji — tylko Slack, bez zależności od n8n
    - matchers:
        - component="automation"
      receiver: "slack-only"

receivers:
  - name: "slack-only"
    slack_configs:
      - channel: "#alerty-datacenter"
        title: "{{ .GroupLabels.alertname }}"
        text: >-
          {{ range .Alerts }}
          *Host:* {{ .Labels.instance }}
          *Alert:* {{ .Annotations.summary }}
          *Details:* {{ .Annotations.description }}
          {{ end }}
        send_resolved: true

  - name: "slack-and-n8n"
    slack_configs:
      - channel: "#alerty-datacenter"
        title: "{{ .GroupLabels.alertname }}"
        text: >-
          {{ range .Alerts }}
          *Host:* {{ .Labels.instance }}
          *Alert:* {{ .Annotations.summary }}
          *Details:* {{ .Annotations.description }}
          {{ end }}
        send_resolved: true
    webhook_configs:
      # Ścieżka produkcyjna webhooka n8n: /webhook/<path> (nie /webhook-test/)
      - url: "http://127.0.0.1:5678/webhook/alertmanager"
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/n8n_webhook_token
